services:

  api:
    build: .
    container_name: banking_api

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - redis
      - mysql

  worker:
    build: .
    container_name: banking_worker

    command: celery -A celery_app.celery_config.celery worker --loglevel=info --pool=solo

    env_file:
      - .env

    depends_on:
      - redis
      - mysql

  redis:
    image: redis:7

    container_name: banking_redis

    ports:
      - "6379:6379"

  mysql:
    image: mysql:8.0

    container_name: banking_mysql

    environment:
      MYSQL_ROOT_PASSWORD: Mathesh@07
      MYSQL_DATABASE: banking_db

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d

volumes:
  mysql_data:
